<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Мессенджер</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #0088cc;
            color: white;
            padding: 10px 15px;
            text-align: center;
        }

        .chat-title {
            font-size: 18px;
            font-weight: bold;
        }

        /* ПОДПИСЬ СТАТУСА ПОДКЛЮЧЕНИЯ */
        .chat-status {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 3px;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #e5ddd5;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 14px;
            word-wrap: break-word;
        }

        .message-author {
            font-size: 11px;
            font-weight: bold;
            color: #555;
            margin-bottom: 3px;
        }

        .message.sent {
            background-color: #dcf8c6;
            align-self: flex-end;
        }

        .message.received {
            background-color: #ffffff;
            align-self: flex-start;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background-color: white;
            border-top: 1px solid #ddd;
        }

        .chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .send-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Улучшенная шапка со статусом -->
        <div class="chat-header">
            <div class="chat-title">Alvigram 3.0</div>
            <div class="chat-status" id="chatStatus">Подключение...</div>
        </div>
        
        <div class="chat-messages" id="chatMessages"></div>
        
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="messageInput" placeholder="Напишите сообщение..." autocomplete="off">
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatStatus = document.getElementById('chatStatus');

        let userName = prompt("Введите ваше имя:") || "Аноним";
        let socket;

        function connectToServer() {
            chatStatus.textContent = "Соединение...";
            chatStatus.style.color = "white";

            // ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ ОТ RENDER (ОБЯЗАТЕЛЬНО БЕЗ СЛЭША / НА КОНЦЕ)
            socket = new WebSocket('wss://alvigram-server.onrender.com');

            socket.onopen = function() {
                chatStatus.textContent = `В сети как: ${userName}`;
                chatStatus.style.color = "#adff2f"; // Зеленый цвет текста
            };

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    const messageDiv = document.createElement('div');
                    messageDiv.classList.add('message', 'received');

                    const authorDiv = document.createElement('div');
                    authorDiv.classList.add('message-author');
                    authorDiv.textContent = data.name;

                    const textSpan = document.createElement('span');
                    textSpan.textContent = data.text;

                    messageDiv.appendChild(authorDiv);
                    messageDiv.appendChild(textSpan);
                    chatMessages.appendChild(messageDiv);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                } catch(e) {
                    const messageDiv = document.createElement('div');
                    messageDiv.classList.add('message', 'received');
                    messageDiv.textContent = event.data;
                    chatMessages.appendChild(messageDiv);
                }
            };

            socket.onerror = function() {
                chatStatus.textContent = "Ошибка сети ❌";
                chatStatus.style.color = "#ff4c4c"; // Красный цвет
            };

            socket.onclose = function() {
                chatStatus.textContent = "Отключен. Переподключение...";
                chatStatus.style.color = "orange";
                // Переподключаемся через 3 секунды, если сеть упала
                setTimeout(connectToServer, 3000);
            };
        }

        // Запуск подключения
        connectToServer();

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '' || socket.readyState !== WebSocket.OPEN) return;

            const messagePackage = { name: userName, text: text };
            socket.send(JSON.stringify(messagePackage));

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', 'sent');
            messageDiv.textContent = text;

            chatMessages.appendChild(messageDiv);
            messageInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') sendMessage();
        });
    </script>

</body>
</html>
