<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Мессенджер</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #0088cc;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #e5ddd5;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 14px;
            word-wrap: break-word;
        }

        /* Стиль для имени автора внутри сообщения */
        .message-author {
            font-size: 11px;
            font-weight: bold;
            color: #555;
            margin-bottom: 3px;
        }

        .message.sent {
            background-color: #dcf8c6;
            align-self: flex-end;
        }

        .message.received {
            background-color: #ffffff;
            align-self: flex-start;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background-color: white;
            border-top: 1px solid #ddd;
        }

        .chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .send-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .send-btn:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">Чат Версия 2.0</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="messageInput" placeholder="Напишите сообщение..." autocomplete="off">
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // Спрашиваем имя пользователя при входе. Если нажал отмену, будет "Аноним"
        let userName = prompt("Введите ваше имя:") || "Аноним";

        // ПОДКЛЮЧАЕМСЯ К СЕРВЕРУ (Вставьте сюда вашу wss:// ссылку от Render)
        const socket = new WebSocket('wss://alvigram-server.onrender.com/');

// ШПИОНСКИЙ КОД ДЛЯ ПОИСКА ОШИБОК НА СМАРТФОНЕ
// Если соединение успешно открылось
socket.onopen = function() {
    alert("Ура! Телефон успешно подключился к серверу!");
};

// Если произошла ошибка сетевого подключения
socket.onerror = function(error) {
    alert("Ошибка сети! Телефон не смог достучаться до сервера. Причина заблокирована браузером.");
};

// Если сервер закрыл соединение
socket.onclose = function(event) {
    alert("Соединение закрыто кодом: " + event.code + ". Причина: " + event.reason);
};

        
        // Когда сервер присылает сообщение
        socket.onmessage = function(event) {
            // Пытаемся расшифровать имя и текст
            try {
                const data = JSON.parse(event.data);
                
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', 'received');

                // Создаем блок для имени собеседника
                const authorDiv = document.createElement('div');
                authorDiv.classList.add('message-author');
                authorDiv.textContent = data.name;

                // Создаем блок для текста
                const textSpan = document.createElement('span');
                textSpan.textContent = data.text;

                messageDiv.appendChild(authorDiv);
                messageDiv.appendChild(textSpan);

                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch(e) {
                // Если пришел обычный текст старого формата
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', 'received');
                messageDiv.textContent = event.data;
                chatMessages.appendChild(messageDiv);
            }
        };

        // Функция отправки
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '') return;

            // Упаковываем имя и текст в один пакет (JSON)
            const messagePackage = {
                name: userName,
                text: text
            };

            // Отправляем пакет на сервер в виде текста
            socket.send(JSON.stringify(messagePackage));

            // Показываем СВОЁ сообщение на экране (свое имя выводить не обязательно, ведь мы и так знаем, что это мы)
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', 'sent');
            messageDiv.textContent = text;

            chatMessages.appendChild(messageDiv);
            messageInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });
    </script>

</body>
</html>
